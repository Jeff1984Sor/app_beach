# Nginx reverse proxy - copie para /etc/nginx/sites-available/app-beach
# Depois: ln -s /etc/nginx/sites-available/app-beach /etc/nginx/sites-enabled/
# Troque SEU_DOMINIO pelo seu dominio ou IP.

server {
    listen 80;
    server_name SEU_DOMINIO;

    # API -> backend FastAPI (porta 8010)
    location /api/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:8010;
    }

    # Tudo mais -> frontend Next.js (porta 3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
